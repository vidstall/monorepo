---
# `vidctl observer destroy` -- removes the monitoring containers themselves
# (docker rm) but deliberately leaves their bind-mounted data directories
# on disk (see deploy_one_service.yml's volumes: for those mounts), so a
# later `vidctl observer start`/`deploy` recreates them with history intact.
# Use observer_clean.yml to also wipe that data.
# Never touches the host/VM itself -- no destroy/reboot semantics exist
# anywhere in this file.
# No become: this playbook only ever targets operator-provisioned static
# hosts (host_limit is always a registered observer host, see
# cli/observer/lifecycle.py), whose services_root/files are owned by the
# SSH user itself (see cli/observer/inventory.py's _host_entry()) -- and
# container removal only needs Docker-socket access, which that user's
# docker group membership already covers.
- name: Remove the monitoring containers (data preserved)
  hosts: xaisen
  gather_facts: false
  become: false
  tasks:
    - name: Remove monitoring containers
      community.docker.docker_container:
        name: "{{ item }}"
        state: absent
      loop:
        - xaisen-prometheus
        - xaisen-tempo
        - xaisen-grafana
        - xaisen-pushgateway
        - xaisen-loki
