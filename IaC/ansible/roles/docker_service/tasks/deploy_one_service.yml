---
# Included once per entry in xaisen_services (see main.yml). Two namespacing
# keys are in play per item, both from cli/infra.py control() /
# program.py's group-by-name merge:
#   - xaisen_service_item.service       -- the base service TYPE (cp-daemon,
#     relay, ...). Shared across every colocated replica of that type --
#     used only for things that are identical per replica: the Docker
#     image/tag, and the keypair/cap env var NAMES (worker_env.yml).
#   - xaisen_service_item.worker_key  -- "<provider>-<host>-<service>-<N>"
#     (see cli/infra/topology.py's worker_identifier()), always 4 parts
#     (no more un-suffixed index-1 special case) -- unambiguous even when a
#     host colocates several replicas of the same service (vidctl.py's
#     count-prefix --service syntax, e.g. `5cp-daemon`). Used for
#     everything that must be UNIQUE per replica: container name, state
#     dir, wallet file, xaisen_operator_wallets lookup key.
# `| default(xaisen_service_item.service)` guards worker_key in case an
# older-shaped inventory entry (pre-dating this field) ever reaches here.
#
# Split into 5 stages, run in this order -- order is load-bearing: each
# later file reads facts/registered vars set by an earlier one.
#   1. service_common_setup.yml -- state dir, secrets, wallet write
#   2. monitoring_config.yml    -- prometheus/tempo/loki/grafana config
#   3. worker_env.yml           -- keypair/cap/endpoint facts, pull decision
#   4. turn_rpc_lookup.yml      -- relay-only: cp-daemon's public TURN RPC URL
#   5. run_container.yml        -- the shared docker_container task

- name: Common per-service setup (state dir, secrets, wallet)
  ansible.builtin.import_tasks: service_common_setup.yml

- name: Monitoring-stack service config (prometheus/tempo/loki/grafana)
  ansible.builtin.import_tasks: monitoring_config.yml

- name: Worker-daemon env facts and image-pull decision
  ansible.builtin.import_tasks: worker_env.yml

- name: Resolve cp-daemon's TURN RPC URL (relay only)
  ansible.builtin.import_tasks: turn_rpc_lookup.yml

- name: Run this service's container
  ansible.builtin.import_tasks: run_container.yml
