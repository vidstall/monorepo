---
# Included once per entry in xaisen_services (see main.yml). Two namespacing
# keys are in play per item, both from cli/infra.py control() /
# program.py's group-by-name merge:
#   - xaisen_service_item.service       -- the base service TYPE (cp-daemon,
#     relay, ...). Shared across every colocated replica of that type --
#     used only for things that are identical per replica: the Docker
#     image/tag, and the keypair/cap env var NAMES below.
#   - xaisen_service_item.worker_key  -- service, or "service-N" for the
#     Nth colocated replica of that service on this host (vidctl.py's
#     count-prefix --service syntax, e.g. `5cp-daemon`). Index 1 is
#     un-suffixed (== service) for backward compatibility. Used for
#     everything that must be UNIQUE per replica: container name, state
#     dir, wallet file, xaisen_operator_wallets lookup key.
# `| default(xaisen_service_item.service)` guards worker_key in case an
# older-shaped inventory entry (pre-dating this field) ever reaches here.

- name: Ensure persistent state directory exists
  ansible.builtin.file:
    path: "{{ xaisen_services_root }}/runtime/{{ xaisen_service_item.worker_key | default(xaisen_service_item.service) }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Check for a per-service secrets file locally
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../../../secrets/services/{{ xaisen_service_item.service }}.env"
  delegate_to: localhost
  become: false
  register: xaisen_service_secrets_file

- name: Copy per-service secrets file to host
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../secrets/services/{{ xaisen_service_item.service }}.env"
    dest: "{{ xaisen_services_root }}/runtime/{{ xaisen_service_item.worker_key | default(xaisen_service_item.service) }}/service.env"
    owner: root
    group: root
    mode: "0640"
  when: xaisen_service_secrets_file.stat.exists | default(false)

# xaisen_operator_wallets is a dict NESTED by host then worker_key --
# {inventory_hostname: {worker_key: wallet_json}} -- because a single
# `vidctl scenario apply` batch pass (see cli/infra.py control_many_hosts())
# can cover MANY hosts in one Ansible run, and a flat worker_key-only dict
# would collide whenever two different hosts share a worker_key (e.g.
# "cp-daemon" exists on nearly every host in a multi-host scenario) --
# writing one host's wallet onto another host's container. Nesting by
# inventory_hostname keeps each host's lookup isolated even when many hosts
# share the same playbook run. Only ever contains entries for instances
# checked out by the current call; other colocated services/replicas simply
# aren't in the dict this round, so this task is a no-op for them (their
# wallet file is left untouched, whatever it currently holds -- correct,
# since only ITS OWN start/restart call ever refreshes it).
#
# ALWAYS overwrite when this instance's entry IS present this round -- do NOT
# skip just because a file already exists at this path. cli/infra.py's
# checkout_wallet() may hand back a DIFFERENT wallet than whatever is
# currently on disk (e.g. after this instance was killed and relaunched, and
# the pool assigned a new/reassigned wallet) -- skipping on file-exists left
# a stale, wrong wallet in place indefinitely, since nothing else ever
# refreshes this file.
- name: Write operator wallet credentials
  ansible.builtin.copy:
    dest: "{{ xaisen_services_root }}/runtime/{{ xaisen_service_item.worker_key | default(xaisen_service_item.service) }}/{{ inventory_hostname }}.json"
    owner: root
    group: root
    mode: "0600"
    content: "{{ xaisen_operator_wallets[inventory_hostname][xaisen_service_item.worker_key | default(xaisen_service_item.service)] }}"
  when:
    - xaisen_operator_wallets is defined
    - inventory_hostname in xaisen_operator_wallets
    - (xaisen_service_item.worker_key | default(xaisen_service_item.service)) in xaisen_operator_wallets[inventory_hostname]
  no_log: true
  register: xaisen_wallet_credentials_write

# Prometheus/tempo/grafana are pinned upstream images (see cli/context.py
# PINNED_IMAGES) with no keypair/cap/on-chain-endpoint concept -- they need
# a mounted CONFIG file instead, a need no other service has. Rendered here,
# before the docker_container task below, so it's in place before the
# container (re)starts.
- name: Ensure monitoring config directory exists
  ansible.builtin.file:
    path: "{{ xaisen_services_root }}/runtime/{{ xaisen_service_item.worker_key | default(xaisen_service_item.service) }}/config"
    state: directory
    owner: root
    group: root
    mode: "0750"
  when: xaisen_service_item.service in ['prometheus', 'tempo', 'grafana']

# The upstream prom/prometheus, grafana/tempo, and grafana/grafana images
# each run as their own unprivileged UID, not root -- 0777 (rather than a
# root-owned 0750) is what lets that in-container user actually write its
# data into this bind-mounted host directory.
- name: Ensure monitoring data directory exists
  ansible.builtin.file:
    path: "{{ xaisen_services_root }}/runtime/{{ xaisen_service_item.worker_key | default(xaisen_service_item.service) }}/data"
    state: directory
    mode: "0777"
  when: xaisen_service_item.service in ['prometheus', 'tempo', 'grafana']

- name: Write Prometheus scrape config
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ xaisen_services_root }}/runtime/{{ xaisen_service_item.worker_key | default(xaisen_service_item.service) }}/config/prometheus.yml"
    owner: root
    group: root
    mode: "0640"
  when: xaisen_service_item.service == 'prometheus'
  register: xaisen_prometheus_config_write

- name: Write Tempo config
  ansible.builtin.template:
    src: tempo.yaml.j2
    dest: "{{ xaisen_services_root }}/runtime/{{ xaisen_service_item.worker_key | default(xaisen_service_item.service) }}/config/tempo.yaml"
    owner: root
    group: root
    mode: "0640"
  when: xaisen_service_item.service == 'tempo'
  register: xaisen_tempo_config_write

- name: Write Grafana datasource provisioning config
  ansible.builtin.template:
    src: grafana-datasource.yml.j2
    dest: "{{ xaisen_services_root }}/runtime/{{ xaisen_service_item.worker_key | default(xaisen_service_item.service) }}/config/datasource.yml"
    owner: root
    group: root
    mode: "0640"
  when: xaisen_service_item.service == 'grafana'
  register: xaisen_grafana_config_write

# Each worker app expects its own differently-named keypair env var
# (CP_KEYPAIR, SIGNALING_KEYPAIR, PRIVATE_KEY for relay, SUI_PRIVATE_KEY for
# validator-daemon -- see loadKeypair() calls in each apps/*/src/index.ts),
# not the wallet JSON file path itself. Read the bech32 secretKey back from
# the file on the host (written above, or by an earlier start of THIS
# instance if this loop iteration belongs to a co-located sibling) and
# inject it as the correct env var.
- name: Re-check operator state file (may have just been written above)
  ansible.builtin.stat:
    path: "{{ xaisen_services_root }}/runtime/{{ xaisen_service_item.worker_key | default(xaisen_service_item.service) }}/{{ inventory_hostname }}.json"
  register: xaisen_operator_state_file

- name: Read operator wallet secret key from host
  ansible.builtin.slurp:
    src: "{{ xaisen_services_root }}/runtime/{{ xaisen_service_item.worker_key | default(xaisen_service_item.service) }}/{{ inventory_hostname }}.json"
  register: xaisen_operator_state_slurp
  when: xaisen_operator_state_file.stat.exists
  no_log: true

- name: Determine this service's keypair and cap-id env vars
  ansible.builtin.set_fact:
    xaisen_keypair_env_name: "{{ xaisen_keypair_env_names.get(xaisen_service_item.service) }}"
    xaisen_keypair_env_value: >-
      {{
        (xaisen_operator_state_slurp.content | b64decode | from_json).secretKey
        if (xaisen_operator_state_slurp is defined and xaisen_operator_state_slurp.content is defined)
        else ''
      }}
    xaisen_cap_env_name: "{{ xaisen_cap_env_names.get(xaisen_service_item.service) }}"
    xaisen_cap_env_value: >-
      {{
        (xaisen_operator_state_slurp.content | b64decode | from_json).capId | default('')
        if (xaisen_operator_state_slurp is defined and xaisen_operator_state_slurp.content is defined)
        else ''
      }}
  vars:
    xaisen_keypair_env_names:
      relay: PRIVATE_KEY
      signaling: SIGNALING_KEYPAIR
      cp-daemon: CP_KEYPAIR
      validator-daemon: SUI_PRIVATE_KEY
      bot: PRIVATE_KEY
    # Set only when cli/wallet.py's checkout_wallet() found this wallet
    # already owns a Cap object on-chain (see wallet.py resolve_cap_id) --
    # tells each daemon's auto-register.ts to skip registration instead of
    # retrying it and hitting registration::E_ALREADY_REGISTERED forever.
    xaisen_cap_env_names:
      relay: MINER_CAP_ID
      signaling: MINER_CAP_ID
      cp-daemon: CP_CAP_ID
      validator-daemon: VALIDATOR_CAP_ID
  no_log: true

# Skip the (40-100s, measured) network pull when the image already cached on
# this host for the desired tag matches the digest cli/registry.py actually
# pushed -- read from xaisen_image_digests (docker_deploy_extra_vars()).
# Pinned images (prometheus) are untouched -- not in xaisen_images, so
# xaisen_needs_pull below always evaluates true for them, same as before.
# cli/registry.py's tag is a reused git-short-SHA and `docker build` is NOT
# reproducible (floating base image, apt drift), so a same-tag image can
# legitimately have different bytes between pushes -- comparing the actual
# pushed DIGEST (not just presence of the tag) is what keeps this safe: any
# real content change still forces a real pull, only a genuine no-op skips it.
- name: Check locally cached image digest (skip redundant pulls when unchanged)
  community.docker.docker_image_info:
    name: "{{ xaisen_images[xaisen_service_item.service] }}:{{ xaisen_tags[xaisen_service_item.service] }}"
  register: xaisen_local_image_info
  when:
    - xaisen_images is defined and xaisen_tags is defined
    - xaisen_service_item.service in xaisen_images
    - xaisen_service_item.service in xaisen_tags

- name: Decide whether this service's image actually needs pulling
  ansible.builtin.set_fact:
    xaisen_needs_pull: >-
      {{
        (xaisen_images is not defined) or (xaisen_tags is not defined)
        or (xaisen_service_item.service not in xaisen_images)
        or ((xaisen_local_image_info.images | default([])) | length == 0)
        or ((xaisen_image_digests | default({})).get(xaisen_service_item.service, '') == '')
        or ((xaisen_image_digests[xaisen_service_item.service])
            not in (xaisen_local_image_info.images[0].RepoDigests | default([])))
      }}

# relay/signaling each register THEIR OWN address on-chain (RelayNodeInfo /
# SignalingNodeInfo's endpoint_url) so clients know where to connect --
# without this, both apps default to `ws://127.0.0.1:<port>` (see
# apps/relay/src/index.ts / apps/signaling/src/index.ts), which is useless
# to any client since it's the visitor's own loopback address, not the
# droplet's. sslip.io resolves "<anything>.<a>-<b>-<c>-<d>.sslip.io" to
# a.b.c.d with no real DNS registration needed -- the worker_key prefix
# gives each colocated service on this host its OWN hostname (and therefore
# its own Let's Encrypt cert + Caddy site block, see main.yml's shared
# xaisen-caddy) sharing one droplet IP, since relay and signaling both
# publicly listen on the same host and can't each own ports 80/443.
- name: Determine this service's public sslip.io endpoint env var
  ansible.builtin.set_fact:
    xaisen_public_endpoint_env_name: "{{ xaisen_public_endpoint_env_names.get(xaisen_service_item.service) }}"
    xaisen_sslip_host: "{{ (xaisen_service_item.worker_key | default(xaisen_service_item.service)) }}.{{ ansible_host | replace('.', '-') }}.sslip.io"
  vars:
    xaisen_public_endpoint_env_names:
      relay: RELAY_ENDPOINT_URL
      signaling: ENDPOINT_URL

# F1/G3.2b inter-relay PipeTransport (apps/relay/src/index.ts, packages/
# inter-relay-client/*): a standby announces its {ip,port} UP to the primary
# so the primary's mediasoup PipeTransport can connect() to the REAL host.
# ANNOUNCED_IP defaults to 127.0.0.1 (see index.ts/inter-relay.ts) for
# same-machine local/bench setups; left unset on a real multi-droplet deploy,
# every relay announces "connect to yourself" -- the pipe "connects"
# (mediasoup's connect() RPC always succeeds locally) but no RTP ever crosses
# hosts, so a standby's joiner never gets the primary's piped producer
# (silently stuck on "no announced producer"). Set to this droplet's real
# public IP so cross-host dual-relay rooms actually forward media.
- name: Run the service container
  vars:
    xaisen_relay_port_offset: "{{ ((xaisen_service_item.index | default(1) | int) - 1) * 100 }}"
    xaisen_relay_rtc_min: "{{ 10000 + (xaisen_relay_port_offset | int) }}"
    xaisen_relay_rtc_max: "{{ xaisen_relay_rtc_min | int + 99 }}"
    xaisen_relay_pipe_min: "{{ 40000 + (xaisen_relay_port_offset | int) }}"
    xaisen_relay_pipe_max: "{{ xaisen_relay_pipe_min | int + 99 }}"
  community.docker.docker_container:
    name: "xaisen-{{ xaisen_service_item.worker_key | default(xaisen_service_item.service) }}"
    # Pinned upstream images (prometheus/tempo/grafana, see cli/context.py
    # PINNED_IMAGES) are pulled straight from Docker Hub via
    # xaisen_pinned_images -- they never go through cli/registry.py's
    # build/push flow (no Dockerfile, no repo build context), so
    # xaisen_images/xaisen_tags have no entry for them.
    image: >-
      {{
        xaisen_pinned_images[xaisen_service_item.service]
        if (xaisen_pinned_images is defined and xaisen_service_item.service in xaisen_pinned_images)
        else (xaisen_images[xaisen_service_item.service] ~ ':' ~ xaisen_tags[xaisen_service_item.service])
      }}
    # Unlike prometheus's image (defaults to /etc/prometheus/prometheus.yml
    # with no args needed) and grafana's (reads its provisioning dir from a
    # fixed default path too), grafana/tempo's entrypoint requires an
    # explicit -config.file argument pointing at the mounted config (see
    # volumes: below).
    command: "{{ '-config.file=/etc/tempo.yaml' if xaisen_service_item.service == 'tempo' else omit }}"
    # cli/registry.py tags images with the git short SHA, which is stable
    # across repeat `vidctl registry publish` runs on an uncommitted branch
    # -- without forcing a pull, a host that already has that tag cached
    # locally from an earlier deploy this session silently keeps running the
    # stale image even after a newer one with the same tag was pushed. Fixed
    # here by pulling only when the digest genuinely differs (see
    # xaisen_needs_pull above) instead of always -- xaisen_needs_pull
    # defaults true when its computing task above didn't run (e.g. `omit`/
    # not-yet-set), preserving the original always-pull safety net.
    pull: "{{ xaisen_needs_pull | default(true) }}"
    restart_policy: unless-stopped
    # Each container's own desired_state, not the host-level aggregate --
    # lets one colocated service be paused/restarted independently of
    # its siblings sharing the host.
    state: "{{ 'started' if xaisen_service_item.desired_state == 'running' else 'stopped' }}"
    restart: >-
      {{
        (xaisen_container_state | default('started')) == 'restarted'
        or xaisen_wallet_credentials_write is changed
        or (xaisen_prometheus_config_write is defined and xaisen_prometheus_config_write is changed)
        or (xaisen_tempo_config_write is defined and xaisen_tempo_config_write is changed)
        or (xaisen_grafana_config_write is defined and xaisen_grafana_config_write is changed)
      }}
    # UDP RTC/pipe ranges are offset per worker_index (100 ports apart) so
    # colocated relay replicas on the same host don't collide -- mirrors how
    # the TCP port below is offset in cli/infra.py's set_vm_defaults().
    # Prometheus/tempo/grafana have no auth of their own worth relying on for
    # network exposure (grafana DOES have its own login, but that's gated at
    # the Caddy ingress layer, not here) -- their published ports below
    # always bind loopback-only, never 0.0.0.0. Prometheus is reachable only
    # via an SSH tunnel, published under `host_port` (an operator-chosen,
    # non-default port -- see cli/observer's DEFAULT_HOST_PORT), NOT its
    # fixed internal 9090, so nothing externally visible sits on its
    # well-known default port. Tempo/grafana's ports have no such obscurity
    # need (each is only ever reached through observer-caddyfile.j2's
    # reverse proxy, never directly), so they stay on their own fixed
    # internal ports; tempo's second port (3200, the query API,
    # SSH-tunnel-reached like Prometheus) is hardcoded here the same way
    # relay's RTC/pipe UDP ranges are below -- a single fixed pair isn't
    # worth a generic multi-port mechanism.
    ports: >-
      {{
        ([
          ('127.0.0.1:' ~ (xaisen_service_item.host_port | default(xaisen_service_item.port)) ~ ':' ~ xaisen_service_item.port)
          if xaisen_service_item.service in ['prometheus', 'tempo', 'grafana']
          else (xaisen_service_item.port ~ ':' ~ xaisen_service_item.port)
        ] if (xaisen_service_item.port | default(0) | int > 0) else [])
        + (['127.0.0.1:3200:3200'] if xaisen_service_item.service == 'tempo' else [])
        + ([xaisen_relay_rtc_min ~ '-' ~ xaisen_relay_rtc_max ~ ':' ~ xaisen_relay_rtc_min ~ '-' ~ xaisen_relay_rtc_max ~ '/udp',
            xaisen_relay_pipe_min ~ '-' ~ xaisen_relay_pipe_max ~ ':' ~ xaisen_relay_pipe_min ~ '-' ~ xaisen_relay_pipe_max ~ '/udp']
           if xaisen_service_item.service == 'relay' else [])
      }}
    env_file: "{{ (xaisen_services_root ~ '/runtime/' ~ (xaisen_service_item.worker_key | default(xaisen_service_item.service)) ~ '/service.env') if (xaisen_service_secrets_file.stat.exists | default(false)) else omit }}"
    # /prometheus (prometheus) and /var/tempo (tempo) are each service's own
    # default storage path -- bind-mounted (not left in the container's
    # writable layer) so `vidctl observer destroy` (docker rm the container)
    # preserves scraped history/traces; only `vidctl observer clean` deletes
    # these dirs. (Kept as plain YAML comments here, not inline in the Jinja
    # expression below -- Jinja only supports `{# #}` block comments, not
    # `#` inside a `{{ }}` expression, which is a template syntax error.)
    volumes: >-
      {{
        [
          xaisen_services_root ~ '/runtime/contract:' ~ xaisen_services_root ~ '/runtime/contract:ro',
          xaisen_services_root ~ '/runtime/' ~ (xaisen_service_item.worker_key | default(xaisen_service_item.service)) ~ ':' ~ xaisen_services_root ~ '/runtime/' ~ (xaisen_service_item.worker_key | default(xaisen_service_item.service)),
        ]
        + (
          [
            xaisen_services_root ~ '/runtime/' ~ (xaisen_service_item.worker_key | default(xaisen_service_item.service)) ~ '/config/prometheus.yml:/etc/prometheus/prometheus.yml:ro',
            xaisen_services_root ~ '/runtime/' ~ (xaisen_service_item.worker_key | default(xaisen_service_item.service)) ~ '/data:/prometheus',
          ]
          if xaisen_service_item.service == 'prometheus' else []
        )
        + (
          [
            xaisen_services_root ~ '/runtime/' ~ (xaisen_service_item.worker_key | default(xaisen_service_item.service)) ~ '/config/tempo.yaml:/etc/tempo.yaml:ro',
            xaisen_services_root ~ '/runtime/' ~ (xaisen_service_item.worker_key | default(xaisen_service_item.service)) ~ '/data:/var/tempo',
          ]
          if xaisen_service_item.service == 'tempo' else []
        )
        + (
          [
            xaisen_services_root ~ '/runtime/' ~ (xaisen_service_item.worker_key | default(xaisen_service_item.service)) ~ '/config/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro',
            xaisen_services_root ~ '/runtime/' ~ (xaisen_service_item.worker_key | default(xaisen_service_item.service)) ~ '/data:/var/lib/grafana',
          ]
          if xaisen_service_item.service == 'grafana' else []
        )
      }}
    # Joins the shared bridge network (main.yml) instead of Docker's default
    # bridge -- lets this container's Caddy TLS sidecar below reverse_proxy
    # to it by container name (only user-defined networks support
    # container-name DNS resolution). Published host ports (above) are
    # unaffected by which network a container is on.
    networks:
      - name: xaisen-net
    # loadNetworkConfig() (services/worker/packages/shared/src/chain/client.ts)
    # reads PACKAGE_ID/NETWORK_REGISTRY_ID/etc. and SUI_NETWORK straight from
    # process.env -- it never reads CONTRACT_ENV_PATH itself (that var only
    # tells the app where the file *would* be). xaisen_contract_values is
    # populated by cli/infra.py's docker_deploy_extra_vars() by parsing
    # runtime/contract/<env>.env -- combine() overlays those real keys on
    # top of the static ones below. RTC_MIN_PORT/RTC_MAX_PORT/PIPE_PORT_RANGE
    # tell relay's mediasoup workers and inter-relay pipe transports about
    # the per-replica port range reserved above. REGISTRATION_MODE=voting
    # makes fresh (MINER_CAP_ID-unset) relay/signaling/validator-daemon
    # registrations wait for a CP's async role vote before Step 2's registry
    # enrollment (which asserts cap.role == <role>) -- see auto-register.ts's
    # votingMode branch. cp-daemon is excluded: it casts votes, not waits.
    # otel-bootstrap.ts (packages/shared) no-ops when OTEL_EXPORTER_OTLP_ENDPOINT
    # is unset, so it's safe to inject unconditionally for these 4 services even
    # before the operator has seeded secrets/services/otel.env (see
    # cli/infra/secrets.py's otel_exporter_vars()) -- same 4-service list as
    # METRICS_AUTH_TOKEN above, excluding bot/prometheus/tempo/grafana.
    # Grafana's own login, not the observer ingress Caddy's bearer gate (unlike
    # tempo's ingest) -- see cli/observer/secrets.py's grafana_admin_password().
    # GF_SERVER_ROOT_URL tells Grafana its own real public URL so redirects/
    # asset links are correct behind the reverse proxy.
    # (Comments kept as plain YAML here, not inline in the Jinja expression
    # below -- Jinja only supports `{# #}` block comments, not `#` inside a
    # `{{ }}` expression, which is a template syntax error.)
    env: >-
      {{
        {
          'CONTRACT_ENV_PATH': xaisen_services_root ~ '/runtime/contract/' ~ xaisen_env ~ '.env',
          'CONTRACT_NETWORK': xaisen_env,
          'SUI_NETWORK': xaisen_env,
        }
        | combine(xaisen_contract_values[xaisen_env] | default({}))
        | combine({xaisen_keypair_env_name: xaisen_keypair_env_value} if (xaisen_keypair_env_name and xaisen_keypair_env_value) else {})
        | combine({xaisen_cap_env_name: xaisen_cap_env_value} if (xaisen_cap_env_name and xaisen_cap_env_value) else {})
        | combine({xaisen_public_endpoint_env_name: 'wss://' ~ xaisen_sslip_host} if xaisen_public_endpoint_env_name else {})
        | combine({'ANNOUNCED_IP': ansible_host} if xaisen_service_item.service == 'relay' else {})
        | combine({'RTC_MIN_PORT': xaisen_relay_rtc_min, 'RTC_MAX_PORT': xaisen_relay_rtc_max, 'PIPE_PORT_RANGE': xaisen_relay_pipe_min ~ '-' ~ xaisen_relay_pipe_max} if xaisen_service_item.service == 'relay' else {})
        | combine({'REGISTRATION_MODE': 'voting'} if xaisen_service_item.service in ['relay', 'signaling', 'validator-daemon'] else {})
        | combine({'METRICS_AUTH_TOKEN': xaisen_metrics_auth_token} if (xaisen_metrics_auth_token | default('')) and xaisen_service_item.service in ['relay', 'signaling', 'cp-daemon', 'validator-daemon'] else {})
        | combine({'OTEL_EXPORTER_OTLP_ENDPOINT': xaisen_otel_exporter_endpoint, 'OTEL_SERVICE_NAME': xaisen_service_item.service} if (xaisen_otel_exporter_endpoint | default('')) and xaisen_service_item.service in ['relay', 'signaling', 'cp-daemon', 'validator-daemon'] else {})
        | combine({'OTEL_EXPORTER_OTLP_HEADERS': xaisen_otel_exporter_headers} if (xaisen_otel_exporter_headers | default('')) and (xaisen_otel_exporter_endpoint | default('')) and xaisen_service_item.service in ['relay', 'signaling', 'cp-daemon', 'validator-daemon'] else {})
        | combine({'GF_SECURITY_ADMIN_PASSWORD': xaisen_grafana_admin_password, 'GF_SERVER_ROOT_URL': 'https://grafana.' ~ (ansible_host | replace('.', '-')) ~ '.sslip.io/'} if xaisen_service_item.service == 'grafana' else {})
      }}
  async: 300
  poll: 0
  register: xaisen_container_start_job
  when: >-
    (xaisen_pinned_images is defined and xaisen_service_item.service in xaisen_pinned_images)
    or (xaisen_images is defined and xaisen_tags is defined and xaisen_service_item.service in xaisen_images and xaisen_service_item.service in xaisen_tags)
  no_log: true

# Fired above with poll:0 so this host's per-service loop can move straight
# to the next service instead of blocking on this container's create/start
# (and, on a real pull, the transfer) before starting the next one --
# main.yml's "Wait for all this host's service containers to finish
# starting" task (run once, after the whole loop) polls every job below
# concurrently instead of the loop waiting on each container in turn.
- name: Track this service's async container-start job
  ansible.builtin.set_fact:
    xaisen_container_jobs: "{{ (xaisen_container_jobs | default([])) + [{'label': xaisen_service_item.worker_key | default(xaisen_service_item.service), 'job': xaisen_container_start_job}] }}"
  when: xaisen_container_start_job is defined and xaisen_container_start_job.ansible_job_id is defined

# NOTE: the TLS-terminating Caddy proxy for this service (if it's relay or
# signaling) is NOT set up here -- ports 80/443 can only be bound once per
# host, so it's a single shared container covering every relay/signaling
# instance on this host, configured once in main.yml after this whole loop
# (which is what populates xaisen_public_endpoint_env_name-eligible
# services' state) rather than per-service here.
