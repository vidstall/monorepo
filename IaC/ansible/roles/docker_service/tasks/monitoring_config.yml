---
# Second stage of deploy_one_service.yml's per-service pipeline. No-ops
# entirely for worker daemons (relay/signaling/cp-daemon/validator-daemon/
# bot) -- every task here is gated on a specific monitoring-stack service
# name. Prometheus/tempo/grafana are pinned upstream images (see
# cli/context.py PINNED_IMAGES) with no keypair/cap/on-chain-endpoint
# concept -- they need a mounted CONFIG file instead, a need no other
# service has. Rendered here, before run_container.yml's docker_container
# task, so it's in place before the container (re)starts. Pushgateway is
# ALSO a pinned upstream image but needs neither a config file nor a data
# directory (it holds pushed metrics in memory only, no `--persistence.file`
# flag set in run_container.yml) -- it's deliberately absent from the
# `when:` lists below.
- name: Ensure monitoring config directory exists
  ansible.builtin.file:
    path: "{{ xaisen_services_root }}/runtime/{{ xaisen_service_item.worker_key | default(xaisen_service_item.service) }}/config"
    state: directory
    owner: "{{ 'root' if xaisen_provider | default('') != 'static' else omit }}"
    group: "{{ 'root' if xaisen_provider | default('') != 'static' else omit }}"
    mode: "0750"
  when: xaisen_service_item.service in ['prometheus', 'tempo', 'grafana', 'loki']

# The upstream prom/prometheus, grafana/tempo, grafana/grafana, and
# grafana/loki images each run as their own unprivileged UID, not root --
# 0777 (rather than a root-owned 0750) is what lets that in-container user
# actually write its data into this bind-mounted host directory.
- name: Ensure monitoring data directory exists
  ansible.builtin.file:
    path: "{{ xaisen_services_root }}/runtime/{{ xaisen_service_item.worker_key | default(xaisen_service_item.service) }}/data"
    state: directory
    mode: "0777"
  when: xaisen_service_item.service in ['prometheus', 'tempo', 'grafana', 'loki']

- name: Write Prometheus scrape config
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ xaisen_services_root }}/runtime/{{ xaisen_service_item.worker_key | default(xaisen_service_item.service) }}/config/prometheus.yml"
    owner: "{{ 'root' if xaisen_provider | default('') != 'static' else omit }}"
    group: "{{ 'root' if xaisen_provider | default('') != 'static' else omit }}"
    mode: "0640"
  when: xaisen_service_item.service == 'prometheus'
  register: xaisen_prometheus_config_write

- name: Write Tempo config
  ansible.builtin.template:
    src: tempo.yaml.j2
    dest: "{{ xaisen_services_root }}/runtime/{{ xaisen_service_item.worker_key | default(xaisen_service_item.service) }}/config/tempo.yaml"
    owner: "{{ 'root' if xaisen_provider | default('') != 'static' else omit }}"
    group: "{{ 'root' if xaisen_provider | default('') != 'static' else omit }}"
    mode: "0640"
  when: xaisen_service_item.service == 'tempo'
  register: xaisen_tempo_config_write

- name: Write Loki config
  ansible.builtin.template:
    src: loki.yaml.j2
    dest: "{{ xaisen_services_root }}/runtime/{{ xaisen_service_item.worker_key | default(xaisen_service_item.service) }}/config/loki.yaml"
    owner: "{{ 'root' if xaisen_provider | default('') != 'static' else omit }}"
    group: "{{ 'root' if xaisen_provider | default('') != 'static' else omit }}"
    mode: "0640"
  when: xaisen_service_item.service == 'loki'
  register: xaisen_loki_config_write

- name: Write Grafana datasource provisioning config
  ansible.builtin.template:
    src: grafana-datasource.yml.j2
    dest: "{{ xaisen_services_root }}/runtime/{{ xaisen_service_item.worker_key | default(xaisen_service_item.service) }}/config/datasource.yml"
    owner: "{{ 'root' if xaisen_provider | default('') != 'static' else omit }}"
    group: "{{ 'root' if xaisen_provider | default('') != 'static' else omit }}"
    mode: "0640"
  when: xaisen_service_item.service == 'grafana'
  register: xaisen_grafana_config_write

- name: Write Grafana dashboard provider config
  ansible.builtin.template:
    src: grafana-dashboard-provider.yml.j2
    dest: "{{ xaisen_services_root }}/runtime/{{ xaisen_service_item.worker_key | default(xaisen_service_item.service) }}/config/dashboard-provider.yml"
    owner: "{{ 'root' if xaisen_provider | default('') != 'static' else omit }}"
    group: "{{ 'root' if xaisen_provider | default('') != 'static' else omit }}"
    mode: "0640"
  when: xaisen_service_item.service == 'grafana'
  register: xaisen_dashboard_provider_write

- name: Ensure Grafana dashboards config subdirectory exists
  ansible.builtin.file:
    path: "{{ xaisen_services_root }}/runtime/{{ xaisen_service_item.worker_key | default(xaisen_service_item.service) }}/config/dashboards"
    state: directory
    owner: "{{ 'root' if xaisen_provider | default('') != 'static' else omit }}"
    group: "{{ 'root' if xaisen_provider | default('') != 'static' else omit }}"
    mode: "0750"
  when: xaisen_service_item.service == 'grafana'

# Both old dashboards (xaisen-fleet, xaisen-academic-eval) were replaced by
# the 6-dashboard set under files/dashboards/ -- ansible.builtin.copy's
# directory sync (below) only adds/updates files, it never deletes a
# destination file whose source was removed, so the stale rendered files
# from any host deployed before this change need an explicit cleanup pass.
# bot.json was folded into peer-quality.json (now titled "User") since the
# bot is just a fake user, same reasoning applies to its leftover file.
- name: Remove stale pre-redesign dashboard JSON files
  ansible.builtin.file:
    path: "{{ xaisen_services_root }}/runtime/{{ xaisen_service_item.worker_key | default(xaisen_service_item.service) }}/config/dashboards/{{ item }}"
    state: absent
  loop:
    - xaisen-fleet.json
    - xaisen-academic-eval.json
    - bot.json
  when: xaisen_service_item.service == 'grafana'

# Static JSON (no real Jinja templating happens in any of them), so a plain
# directory-wide copy replaces the old one-template-task-per-dashboard
# boilerplate -- Grafana's file-provider polls the whole mounted folder
# (see grafana-dashboard-provider.yml.j2), so adding/removing a dashboard is
# just adding/removing a file under files/dashboards/, no task changes needed.
- name: Copy Grafana dashboard JSON files
  ansible.builtin.copy:
    src: dashboards/
    dest: "{{ xaisen_services_root }}/runtime/{{ xaisen_service_item.worker_key | default(xaisen_service_item.service) }}/config/dashboards/"
    owner: "{{ 'root' if xaisen_provider | default('') != 'static' else omit }}"
    group: "{{ 'root' if xaisen_provider | default('') != 'static' else omit }}"
    mode: "0640"
  when: xaisen_service_item.service == 'grafana'
  register: xaisen_dashboards_write

# Sidecar for Grafana's PNG render API (/render/d-solo/<uid>/<slug>?panelId=N),
# used by cli/observer/grafana_render.py to capture per-panel screenshots at
# the end of `vidctl scenario run` (into logs/<key>/<run_timestamp>/img/).
# Not a PINNED_IMAGES/DOCKER_SERVICES entry -- unlike prometheus/tempo/etc.
# this is never independently scheduled in a scenario/topology.toml, it's a
# pure grafana sidecar, same pattern as reverse_proxy.yml's shared Caddy
# containers being driven off `xaisen_service_item.service == 'grafana'`
# rather than being a service of its own. Fixed container name (not
# worker_key-suffixed) since grafana itself is a singleton per host, same
# convention as xaisen-caddy/xaisen-observer-caddy. Runs the OFFICIAL remote
# renderer image (bundles its own headless Chromium + HTTP server) rather
# than GF_INSTALL_PLUGINS baking the renderer into Grafana's own container
# -- keeps Grafana's image untouched and the renderer's (much heavier,
# Chromium-based) resource usage isolated to its own container.
- name: Run the Grafana image-renderer sidecar
  community.docker.docker_container:
    name: xaisen-grafana-renderer
    image: "grafana/grafana-image-renderer:3.12.4"
    restart_policy: unless-stopped
    state: started
    # Docker's default /dev/shm is 64MB, far too small for headless Chromium
    # -- it crashes on launch (Puppeteer never sees the WS endpoint URL in
    # stdout, every render times out after 30s with no other hint). This is
    # the documented fix for grafana/grafana-image-renderer specifically,
    # not a generic tuning knob.
    shm_size: 1G
    # community.docker.docker_container does NOT compare shm_size against a
    # running container's actual config by default -- without this, changing
    # shm_size above (as just happened) is silently a no-op against an
    # already-running container: `state: started` reports "ok" and leaves
    # the stale 64MB-shm container running untouched, with no error or hint
    # that the new value was never applied. Confirmed live: a real `observer
    # deploy` reported success while `docker inspect` still showed the old
    # 67108864-byte default; only forcing this comparison actually recreated
    # the container.
    comparisons:
      shm_size: strict
    networks:
      - name: xaisen-net
  when: xaisen_service_item.service == 'grafana'
