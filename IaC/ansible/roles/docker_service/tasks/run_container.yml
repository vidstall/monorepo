---
# Final stage of deploy_one_service.yml's per-service pipeline. Single
# shared docker_container task used by EVERY service type -- per-service
# differences are expressed as inline Jinja branches rather than N separate
# near-duplicate tasks, since Ansible's `docker_container` args are one
# fixed shape regardless of which service is being started. Depends on
# facts registered by service_common_setup.yml, monitoring_config.yml, and
# worker_env.yml all having already run this iteration (see
# deploy_one_service.yml's include order).
#
# xaisen_keypair_env_name/xaisen_keypair_env_value/xaisen_cap_env_name/
# xaisen_cap_env_value/xaisen_public_endpoint_env_name/xaisen_sslip_host are
# now only SET for their respective service subsets (worker_env.yml's two
# gated fact tasks) -- every reference below wraps them in `| default('')`
# so a gated-out service (e.g. prometheus) evaluates these as empty rather
# than raising AnsibleUndefinedVariable.

# F1/G3.2b inter-relay PipeTransport (apps/relay/src/index.ts, packages/
# inter-relay-client/*): a standby announces its {ip,port} UP to the primary
# so the primary's mediasoup PipeTransport can connect() to the REAL host.
# ANNOUNCED_IP defaults to 127.0.0.1 (see index.ts/inter-relay.ts) for
# same-machine local/bench setups; left unset on a real multi-droplet deploy,
# every relay announces "connect to yourself" -- the pipe "connects"
# (mediasoup's connect() RPC always succeeds locally) but no RTP ever crosses
# hosts, so a standby's joiner never gets the primary's piped producer
# (silently stuck on "no announced producer"). Set to this droplet's real
# public IP so cross-host dual-relay rooms actually forward media.
- name: Run the service container
  vars:
    xaisen_relay_port_offset: "{{ ((xaisen_service_item.index | default(1) | int) - 1) * 100 }}"
    xaisen_relay_rtc_min: "{{ 10000 + (xaisen_relay_port_offset | int) }}"
    xaisen_relay_rtc_max: "{{ xaisen_relay_rtc_min | int + 99 }}"
    xaisen_relay_pipe_min: "{{ 40000 + (xaisen_relay_port_offset | int) }}"
    xaisen_relay_pipe_max: "{{ xaisen_relay_pipe_min | int + 99 }}"
    # Fleet-wide log shipping (every container this task creates, on every
    # host) -- two different push targets depending on where this
    # container lives, since fleet VMs across different cloud providers
    # share no private network with the observer host (bourbon):
    #   - The observer host itself (xaisen_provider == 'static') logs
    #     straight to its own colocated loki container over the shared
    #     xaisen-net bridge by container name -- no public hop, no auth,
    #     same trust boundary Grafana already uses to reach Prometheus/
    #     Tempo.
    #   - Every fleet VM logs to the PUBLIC, Basic-Auth-gated ingest URL
    #     the operator copied from `vidctl observer deploy`'s printed
    #     output into secrets/services/loki.env (xaisen_loki_push_url/
    #     xaisen_loki_auth_token, sourced via cli/infra/secrets.py's
    #     loki_shipping_vars() -- see docker_deploy_extra_vars()). Empty
    #     until seeded, in which case log shipping is simply skipped
    #     (graceful no-op, same as OTEL's endpoint-unset degradation).
    xaisen_loki_effective_url: >-
      {{
        'http://xaisen-loki:3100/loki/api/v1/push'
        if xaisen_provider | default('') == 'static'
        else (
          (xaisen_loki_push_url | regex_replace('^https://', 'https://xaisen:' ~ xaisen_loki_auth_token ~ '@'))
          if (xaisen_loki_push_url | default('')) and (xaisen_loki_auth_token | default(''))
          else ''
        )
      }}
  community.docker.docker_container:
    name: "xaisen-{{ xaisen_service_item.worker_key | default(xaisen_service_item.service) }}"
    # Pinned upstream images (prometheus/tempo/grafana, see cli/context.py
    # PINNED_IMAGES) are pulled straight from Docker Hub via
    # xaisen_pinned_images -- they never go through cli/registry.py's
    # build/push flow (no Dockerfile, no repo build context), so
    # xaisen_images/xaisen_tags have no entry for them.
    image: >-
      {{
        xaisen_pinned_images[xaisen_service_item.service]
        if (xaisen_pinned_images is defined and xaisen_service_item.service in xaisen_pinned_images)
        else (xaisen_images[xaisen_service_item.service] ~ ':' ~ xaisen_tags[xaisen_service_item.service])
      }}
    # Unlike prometheus's image (defaults to /etc/prometheus/prometheus.yml
    # with no args needed) and grafana's (reads its provisioning dir from a
    # fixed default path too), grafana/tempo's entrypoint requires an
    # explicit -config.file argument pointing at the mounted config (see
    # volumes: below). node_exporter's flags point it at the host's real
    # /proc, /sys, and / (bind-mounted read-only under /host below), since
    # its own container filesystem's /proc/etc reflect the container, not
    # the host it's meant to be reporting on.
    command: >-
      {{
        '-config.file=/etc/tempo.yaml' if xaisen_service_item.service == 'tempo'
        else '-config.file=/etc/loki.yaml' if xaisen_service_item.service == 'loki'
        else '--path.procfs=/host/proc --path.sysfs=/host/sys --path.rootfs=/host/root' if xaisen_service_item.service == 'node_exporter'
        else omit
      }}
    # The upstream prom/prometheus, grafana/tempo, grafana/grafana, and
    # grafana/loki images each run as their own baked-in unprivileged UID by
    # default, which can't read the bind-mounted config file above (owned by
    # whichever user wrote it -- root on Pulumi-managed fleet VMs, the SSH
    # user itself on static hosts like bourbon, see xaisen_services_root's
    # owner/group conditionals). Running the container AS that same
    # connecting user (ansible_user_uid/gid, gathered by site.yml's
    # "Gather host facts" pre-task) instead of loosening the config
    # file's mode keeps prometheus.yml's real bearer credential
    # (xaisen_metrics_auth_token) unreadable by anyone else on the box.
    user: "{{ (ansible_user_uid ~ ':' ~ ansible_user_gid) if xaisen_service_item.service in ['prometheus', 'tempo', 'grafana', 'loki'] else omit }}"
    # cli/registry.py tags images with the git short SHA, which is stable
    # across repeat `vidctl registry publish` runs on an uncommitted branch
    # -- without forcing a pull, a host that already has that tag cached
    # locally from an earlier deploy this session silently keeps running the
    # stale image even after a newer one with the same tag was pushed. Fixed
    # here by pulling only when the digest genuinely differs (see
    # worker_env.yml's xaisen_needs_pull) instead of always -- xaisen_needs_pull
    # defaults true when its computing task above didn't run (e.g. `omit`/
    # not-yet-set), preserving the original always-pull safety net.
    pull: "{{ xaisen_needs_pull | default(true) }}"
    # node_exporter needs the HOST's pid namespace (not the container's own)
    # so its process/systemd collectors report on the real host, not on
    # this one container's near-empty pid 1. community.docker.docker_container
    # (the version pinned by this repo's ansible requirements) exposes this
    # as `pid_mode`, not docker CLI's own `--pid` flag name.
    pid_mode: "{{ 'host' if xaisen_service_item.service == 'node_exporter' else omit }}"
    # Applies to EVERY container this task creates, unconditionally (not
    # scoped to any per-service `when:`) -- unlike Tempo (an env-var-based
    # opt-in fleet apps make themselves), Docker's logging driver operates
    # at the container-runtime level beneath the app process, so this is
    # the one place a single change covers every service/role at once. See
    # xaisen_loki_effective_url above for the static-vs-fleet URL split;
    # this is `omit` (no log_driver override, falls back to Docker's
    # default json-file driver) until that URL is actually populated.
    log_driver: "{{ 'loki' if xaisen_loki_effective_url | default('') else omit }}"
    log_options: >-
      {{
        {
          'loki-url': xaisen_loki_effective_url,
          'loki-retries': '3',
          'loki-batch-size': '400',
          'loki-external-labels': 'service=' ~ xaisen_service_item.service ~ ',worker=' ~ (xaisen_service_item.worker_key | default(xaisen_service_item.service)) ~ ',host=' ~ inventory_hostname,
        }
        if xaisen_loki_effective_url | default('') else omit
      }}
    restart_policy: unless-stopped
    # Each container's own desired_state, not the host-level aggregate --
    # lets one colocated service be paused/restarted independently of
    # its siblings sharing the host.
    state: "{{ 'started' if xaisen_service_item.desired_state == 'running' else 'stopped' }}"
    restart: >-
      {{
        (xaisen_container_state | default('started')) == 'restarted'
        or xaisen_wallet_credentials_write is changed
        or (xaisen_prometheus_config_write is defined and xaisen_prometheus_config_write is changed)
        or (xaisen_tempo_config_write is defined and xaisen_tempo_config_write is changed)
        or (xaisen_loki_config_write is defined and xaisen_loki_config_write is changed)
        or (xaisen_grafana_config_write is defined and xaisen_grafana_config_write is changed)
        or (xaisen_dashboard_provider_write is defined and xaisen_dashboard_provider_write is changed)
        or (xaisen_dashboards_write is defined and xaisen_dashboards_write is changed)
      }}
    # UDP RTC/pipe ranges are offset per worker_index (100 ports apart) so
    # colocated relay replicas on the same host don't collide -- mirrors how
    # the TCP port below is offset in cli/infra.py's set_vm_defaults().
    # Prometheus/tempo/grafana/pushgateway have no auth of their own worth
    # relying on for network exposure (grafana DOES have its own login, but
    # that's gated at the Caddy ingress layer, not here) -- their published
    # ports below always bind loopback-only, never 0.0.0.0. Prometheus is
    # reachable only via an SSH tunnel, published under `host_port` (an
    # operator-chosen, non-default port -- see cli/observer's
    # DEFAULT_HOST_PORT), NOT its fixed internal 9090, so nothing externally
    # visible sits on its well-known default port. Tempo/grafana/pushgateway's
    # ports have no such obscurity need (each is only ever reached through
    # observer-caddyfile.j2's reverse proxy, never directly -- pushgateway's
    # write endpoint gets its own bearer-gated site block there, same as
    # tempo's OTLP ingest), so they stay on their own fixed internal ports;
    # tempo's second port (3200, the query API, SSH-tunnel-reached like
    # Prometheus) is hardcoded here the same way relay's RTC/pipe UDP ranges
    # are below -- a single fixed pair isn't worth a generic multi-port
    # mechanism.
    ports: >-
      {{
        ([
          ('127.0.0.1:' ~ (xaisen_service_item.host_port | default(xaisen_service_item.port)) ~ ':' ~ xaisen_service_item.port)
          if xaisen_service_item.service in ['prometheus', 'tempo', 'grafana', 'pushgateway', 'loki']
          else (xaisen_service_item.port ~ ':' ~ xaisen_service_item.port)
        ] if (xaisen_service_item.port | default(0) | int > 0) else [])
        + (['127.0.0.1:3200:3200'] if xaisen_service_item.service == 'tempo' else [])
        + ([xaisen_relay_rtc_min ~ '-' ~ xaisen_relay_rtc_max ~ ':' ~ xaisen_relay_rtc_min ~ '-' ~ xaisen_relay_rtc_max ~ '/udp',
            xaisen_relay_pipe_min ~ '-' ~ xaisen_relay_pipe_max ~ ':' ~ xaisen_relay_pipe_min ~ '-' ~ xaisen_relay_pipe_max ~ '/udp']
           if xaisen_service_item.service == 'relay' else [])
      }}
    env_file: "{{ (xaisen_services_root ~ '/runtime/' ~ (xaisen_service_item.worker_key | default(xaisen_service_item.service)) ~ '/service.env') if (xaisen_service_secrets_file.stat.exists | default(false)) else omit }}"
    # /prometheus (prometheus) and /var/tempo (tempo) are each service's own
    # default storage path -- bind-mounted (not left in the container's
    # writable layer) so `vidctl observer destroy` (docker rm the container)
    # preserves scraped history/traces; only `vidctl observer clean` deletes
    # these dirs. (Kept as plain YAML comments here, not inline in the Jinja
    # expression below -- Jinja only supports `{# #}` block comments, not
    # `#` inside a `{{ }}` expression, which is a template syntax error.)
    volumes: >-
      {{
        [
          xaisen_services_root ~ '/runtime/contract:' ~ xaisen_services_root ~ '/runtime/contract:ro',
          xaisen_services_root ~ '/runtime/' ~ (xaisen_service_item.worker_key | default(xaisen_service_item.service)) ~ ':' ~ xaisen_services_root ~ '/runtime/' ~ (xaisen_service_item.worker_key | default(xaisen_service_item.service)),
        ]
        + (
          [
            xaisen_services_root ~ '/runtime/' ~ (xaisen_service_item.worker_key | default(xaisen_service_item.service)) ~ '/config/prometheus.yml:/etc/prometheus/prometheus.yml:ro',
            xaisen_services_root ~ '/runtime/' ~ (xaisen_service_item.worker_key | default(xaisen_service_item.service)) ~ '/data:/prometheus',
          ]
          if xaisen_service_item.service == 'prometheus' else []
        )
        + (
          [
            xaisen_services_root ~ '/runtime/' ~ (xaisen_service_item.worker_key | default(xaisen_service_item.service)) ~ '/config/tempo.yaml:/etc/tempo.yaml:ro',
            xaisen_services_root ~ '/runtime/' ~ (xaisen_service_item.worker_key | default(xaisen_service_item.service)) ~ '/data:/var/tempo',
          ]
          if xaisen_service_item.service == 'tempo' else []
        )
        + (
          [
            xaisen_services_root ~ '/runtime/' ~ (xaisen_service_item.worker_key | default(xaisen_service_item.service)) ~ '/config/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro',
            xaisen_services_root ~ '/runtime/' ~ (xaisen_service_item.worker_key | default(xaisen_service_item.service)) ~ '/config/dashboard-provider.yml:/etc/grafana/provisioning/dashboards/dashboard-provider.yml:ro',
            xaisen_services_root ~ '/runtime/' ~ (xaisen_service_item.worker_key | default(xaisen_service_item.service)) ~ '/config/dashboards:/etc/grafana/provisioning/dashboards/xaisen:ro',
            xaisen_services_root ~ '/runtime/' ~ (xaisen_service_item.worker_key | default(xaisen_service_item.service)) ~ '/data:/var/lib/grafana',
          ]
          if xaisen_service_item.service == 'grafana' else []
        )
        + (
          [
            xaisen_services_root ~ '/runtime/' ~ (xaisen_service_item.worker_key | default(xaisen_service_item.service)) ~ '/config/loki.yaml:/etc/loki.yaml:ro',
            xaisen_services_root ~ '/runtime/' ~ (xaisen_service_item.worker_key | default(xaisen_service_item.service)) ~ '/data:/var/loki',
          ]
          if xaisen_service_item.service == 'loki' else []
        )
        + (
          [
            '/proc:/host/proc:ro',
            '/sys:/host/sys:ro',
            '/:/host/root:ro',
          ]
          if xaisen_service_item.service == 'node_exporter' else []
        )
      }}
    # Joins the shared bridge network (common's Docker prerequisites) instead
    # of Docker's default bridge -- lets this container's Caddy TLS sidecar
    # (reverse_proxy.yml) reverse_proxy to it by container name (only
    # user-defined networks support container-name DNS resolution).
    # Published host ports (above) are unaffected by which network a
    # container is on.
    networks:
      - name: xaisen-net
    # loadNetworkConfig() (services/worker/packages/shared/src/chain/client.ts)
    # reads PACKAGE_ID/NETWORK_REGISTRY_ID/etc. and SUI_NETWORK straight from
    # process.env -- it never reads CONTRACT_ENV_PATH itself (that var only
    # tells the app where the file *would* be). xaisen_contract_values is
    # populated by cli/infra.py's docker_deploy_extra_vars() by parsing
    # runtime/contract/<env>.env -- combine() overlays those real keys on
    # top of the static ones below. RTC_MIN_PORT/RTC_MAX_PORT/PIPE_PORT_RANGE
    # tell relay's mediasoup workers and inter-relay pipe transports about
    # the per-replica port range reserved above. REGISTRATION_MODE=voting
    # makes fresh (MINER_CAP_ID-unset) relay/signaling/validator-daemon
    # registrations wait for a CP's async role vote before Step 2's registry
    # enrollment (which asserts cap.role == <role>) -- see auto-register.ts's
    # votingMode branch. cp-daemon is excluded: it casts votes, not waits.
    # otel-bootstrap.ts (packages/shared) no-ops when OTEL_EXPORTER_OTLP_ENDPOINT
    # is unset, so it's safe to inject unconditionally for these 4 services even
    # before the operator has seeded secrets/services/otel.env (see
    # cli/infra/secrets.py's otel_exporter_vars()). bot is NOT in this list --
    # no tracing for it (never imports otel-bootstrap.ts) -- but IS in
    # METRICS_AUTH_TOKEN's list below, since it now runs its own minimal
    # prom-client metrics server (packages/shared/src/metrics-prom.ts) too.
    # Grafana's own login, not the observer ingress Caddy's bearer gate (unlike
    # tempo's ingest) -- see cli/observer/secrets.py's grafana_admin_password().
    # GF_SERVER_ROOT_URL tells Grafana its own real public URL so redirects/
    # asset links are correct behind the reverse proxy.
    # (Comments kept as plain YAML here, not inline in the Jinja expression
    # below -- Jinja only supports `{# #}` block comments, not `#` inside a
    # `{{ }}` expression, which is a template syntax error.)
    # Anonymous Viewer role + embedding allowed for grafana (last combine()
    # below) -- the vidctl GUI's Observation page embeds this URL directly
    # in a webview (see cli/gui/pages/observation_page), which needs
    # dashboards to render with no login prompt. GF_SECURITY_ADMIN_PASSWORD
    # stays required for anything that isn't read-only viewing (editing
    # dashboards, Grafana's own admin settings). GF_SERVER_ROOT_URL tells
    # Grafana its own real public URL so redirects/asset links are correct
    # behind the reverse proxy.
    # GF_RENDERING_SERVER_URL points Grafana at the xaisen-grafana-renderer
    # sidecar (monitoring_config.yml) over the shared xaisen-net bridge by
    # container name -- same trust boundary Grafana already uses to reach
    # Prometheus/Tempo. GF_RENDERING_CALLBACK_URL tells the renderer how to
    # call Grafana BACK (it loads the dashboard itself via headless
    # Chromium) -- also container-name-addressed rather than the public
    # sslip.io URL, since the renderer lives on the same host/network, not
    # on the public internet.
    env: >-
      {{
        {
          'CONTRACT_ENV_PATH': xaisen_services_root ~ '/runtime/contract/' ~ xaisen_env ~ '.env',
          'CONTRACT_NETWORK': xaisen_env,
          'SUI_NETWORK': xaisen_env,
        }
        | combine(xaisen_contract_values[xaisen_env] | default({}))
        | combine({xaisen_keypair_env_name: xaisen_keypair_env_value} if ((xaisen_keypair_env_name | default('')) and (xaisen_keypair_env_value | default(''))) else {})
        | combine({xaisen_cap_env_name: xaisen_cap_env_value} if ((xaisen_cap_env_name | default('')) and (xaisen_cap_env_value | default(''))) else {})
        | combine({xaisen_public_endpoint_env_name: 'wss://' ~ (xaisen_sslip_host | default(''))} if (xaisen_public_endpoint_env_name | default('')) else {})
        | combine({'ANNOUNCED_IP': ansible_host} if xaisen_service_item.service == 'relay' else {})
        | combine({'RTC_MIN_PORT': xaisen_relay_rtc_min, 'RTC_MAX_PORT': xaisen_relay_rtc_max, 'PIPE_PORT_RANGE': xaisen_relay_pipe_min ~ '-' ~ xaisen_relay_pipe_max} if xaisen_service_item.service == 'relay' else {})
        | combine({'REGISTRATION_MODE': 'voting'} if xaisen_service_item.service in ['relay', 'signaling', 'validator-daemon'] else {})
        | combine({'DATA_DIR': xaisen_services_root ~ '/runtime/' ~ (xaisen_service_item.worker_key | default(xaisen_service_item.service)) ~ '/cursor-data'} if xaisen_service_item.service in ['relay', 'signaling', 'cp-daemon', 'validator-daemon'] else {})
        | combine({'METRICS_AUTH_TOKEN': xaisen_metrics_auth_token} if (xaisen_metrics_auth_token | default('')) and xaisen_service_item.service in ['relay', 'signaling', 'cp-daemon', 'validator-daemon', 'bot'] else {})
        | combine({'OTEL_EXPORTER_OTLP_ENDPOINT': xaisen_otel_exporter_endpoint, 'OTEL_SERVICE_NAME': xaisen_service_item.service} if (xaisen_otel_exporter_endpoint | default('')) and xaisen_service_item.service in ['relay', 'signaling', 'cp-daemon', 'validator-daemon'] else {})
        | combine({'OTEL_EXPORTER_OTLP_HEADERS': xaisen_otel_exporter_headers} if (xaisen_otel_exporter_headers | default('')) and (xaisen_otel_exporter_endpoint | default('')) and xaisen_service_item.service in ['relay', 'signaling', 'cp-daemon', 'validator-daemon'] else {})
        | combine({
            'GF_SECURITY_ADMIN_PASSWORD': xaisen_grafana_admin_password,
            'GF_SERVER_ROOT_URL': 'https://grafana.' ~ (ansible_host | replace('.', '-')) ~ '.sslip.io/',
            'GF_AUTH_ANONYMOUS_ENABLED': 'true',
            'GF_AUTH_ANONYMOUS_ORG_ROLE': 'Viewer',
            'GF_SECURITY_ALLOW_EMBEDDING': 'true',
            'GF_RENDERING_SERVER_URL': 'http://xaisen-grafana-renderer:8081/render',
            'GF_RENDERING_CALLBACK_URL': 'http://xaisen-' ~ (xaisen_service_item.worker_key | default(xaisen_service_item.service)) ~ ':' ~ xaisen_service_item.port ~ '/',
          } if xaisen_service_item.service == 'grafana' else {})
      }}
  async: 300
  poll: 0
  register: xaisen_container_start_job
  when: >-
    (xaisen_pinned_images is defined and xaisen_service_item.service in xaisen_pinned_images)
    or (xaisen_images is defined and xaisen_tags is defined and xaisen_service_item.service in xaisen_images and xaisen_service_item.service in xaisen_tags)
  no_log: true

# Fired above with poll:0 so this host's per-service loop can move straight
# to the next service instead of blocking on this container's create/start
# (and, on a real pull, the transfer) before starting the next one --
# main.yml's "Wait for all this host's service containers to finish
# starting" task (run once, after the whole loop) polls every job below
# concurrently instead of the loop waiting on each container in turn.
- name: Track this service's async container-start job
  ansible.builtin.set_fact:
    xaisen_container_jobs: "{{ (xaisen_container_jobs | default([])) + [{'label': xaisen_service_item.worker_key | default(xaisen_service_item.service), 'job': xaisen_container_start_job}] }}"
  when: xaisen_container_start_job is defined and xaisen_container_start_job.ansible_job_id is defined

# NOTE: the TLS-terminating Caddy proxy for this service (if it's relay or
# signaling) is NOT set up here -- ports 80/443 can only be bound once per
# host, so it's a single shared container covering every relay/signaling
# instance on this host, configured once in reverse_proxy.yml after this
# whole loop (which is what populates xaisen_public_endpoint_env_name-eligible
# services' state) rather than per-service here.
