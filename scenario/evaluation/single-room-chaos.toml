# Recovery-time eval, type 4/6: single-room capacity ceiling + 40% chaos.
# PLACEHOLDER bots_per_room=3 (the sweep's start value) -- replace with
# whatever value single-room-capacity's `vidctl scenario eval-find-capacity`
# search actually finds as max_passing before running this for real (manual
# substitution -- there is no automated wiring between the two anymore).
# Kill targets/seed as baseline-chaos.toml -- see this file's own
# [[actions]] worker.leave rows.
# Base topology: scenario/example/akamai-azure.toml (Akamai + Azure only).
# Run: vidctl scenario apply scenario/evaluation/single-room-chaos.toml --yes
#   && vidctl scenario run --yes
# Read results from the Grafana observation system (peer-quality.json's
# "Relay Failover Downtime" panel, infrastructure.json's node-up panels),
# same as baseline-chaos.toml -- no separate scoring script.
# Regenerate: python3 -m cli.scenario.gen_eval_scenarios --base scenario/example/akamai-azure.toml \
#   --out scenario/evaluation/single-room-chaos.toml --name akamai-azure-single-room-chaos \
#   --rooms 1 --bots-per-room <max_passing> --kill-fraction 0.4 --hold-seconds 300 --seed 0

