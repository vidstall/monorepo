# Recovery-time eval, type 2/6: baseline + 40% chaos. 1 room / 3 bots, then
# 14 of 33 killable workers (relay/cp-daemon/validator-daemon) are docker-
# stopped at +120s -- see this file's own [[actions]] worker.leave rows for
# the exact targets (seed=0). Measures relay-promotion / up-gauge recovery
# time, not raw quality.
# Base topology: scenario/example/akamai-azure.toml (Akamai + Azure only).
# Run: vidctl scenario apply scenario/evaluation/baseline-chaos.toml --yes
#   && vidctl scenario run --yes
# Read results from the Grafana observation system this run already feeds
# (no separate scoring script) -- peer-quality.json's "Relay Failover
# Downtime" panel for the relay kills, infrastructure.json's node-up panels
# for cp-daemon/validator-daemon kills, both scoped to this run's time
# window (see scenario status / the run's report/ dir for exact start/end).
# Repeat with a different --seed for more chaos-target samples; there is no
# automated multi-seed roll-up anymore -- compare panels across runs by eye.
# Regenerate: python3 -m cli.scenario.gen_eval_scenarios --base scenario/example/akamai-azure.toml \
#   --out scenario/evaluation/baseline-chaos.toml --name akamai-azure-baseline-chaos \
#   --rooms 1 --bots-per-room 3 --kill-fraction 0.4 --hold-seconds 300 --seed 0

