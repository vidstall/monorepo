# Recovery-time eval, type 6/6: max-room-count capacity ceiling + 40% chaos.
# PLACEHOLDER rooms=3 (the sweep's start value), bots_per_room fixed at 2 --
# replace rooms with whatever value max-rooms-capacity's `vidctl scenario
# eval-find-capacity` search actually finds as max_passing before running
# this for real (manual substitution -- there is no automated wiring
# between the two anymore). Kill targets/seed as baseline-chaos.toml -- see
# this file's own [[actions]] worker.leave rows.
# Base topology: scenario/example/akamai-azure.toml (Akamai + Azure only).
# Run: vidctl scenario apply scenario/evaluation/max-rooms-chaos.toml --yes
#   && vidctl scenario run --yes
# Read results from the Grafana observation system (peer-quality.json's
# "Relay Failover Downtime" panel, infrastructure.json's node-up panels),
# same as baseline-chaos.toml -- no separate scoring script.
# Regenerate: python3 -m cli.scenario.gen_eval_scenarios --base scenario/example/akamai-azure.toml \
#   --out scenario/evaluation/max-rooms-chaos.toml --name akamai-azure-max-rooms-chaos \
#   --rooms <max_passing> --bots-per-room 2 --kill-fraction 0.4 --hold-seconds 300 --seed 0

