# --- Bot-hosting instances (4 of 10, the remainder not used for topology): 003=digitalocean, 004=akamai, 008=akamai, 009=akamai ---
# Bot control server is a singleton per host (its HTTP control API is reached
# directly at a single host) -- never colocate a second instance. The actual
# 5-bots-per-host figure comes from the actions timeline below (bot.create_room /
# bot.join_room), not from extra [[workers]] rows.

# host 003 (digitalocean)
[[workers]]
host = "003"
service = "bot"
provider = "digitalocean"
size = "s-4vcpu-8gb"
worker_index = 1

# host 004 (akamai)
