name = "single-room-mixed-cloud-eval"
env = "devnet"

[contract]
gas_budget = ""
create_registry_if_missing = false
force = false

# Images already published to DigitalOcean's registry -- Akamai hosts just
# pull from it like any other host, no second registry needed.
[registry]
provider = "digitalocean"
tag = ""

# Republish the existing frontend site (same name/provider as the currently
# deployed bucket in runtime/topology.toml) so it picks up THIS scenario's
# freshly-published contract IDs -- needed for a real browser client to join
# the bot-populated room. Reusing name+provider updates it in place; never
# deleted by apply/destroy (see scenario/README.md).
[[frontends]]
name = "site-2-bucket"
object = "frontend"
provider = "alibaba"

# --- Topology hosts (6 of 10, randomly selected [seed=42] -- mixed across both providers): 001=digitalocean, 002=digitalocean, 005=akamai, 006=akamai, 007=akamai, 010=akamai ---
# Each runs 3x validator-daemon, 2x relay, 3x cp-daemon, 2x signaling = 10
# workers/instance x 6 instances = 60 workers.
#
# Hosts 001/002 (digitalocean) and 005 (akamai) are the STATIC baseline -- never
# paused below -- so the room always has a live validator/relay/cp/signaling set
# even while 006/007/010 are being knocked down. Worker pause/restart (used by
# the worker.leave/worker.join churn below) is only supported for --provider
# alibaba/akamai (see cli/infra/control.py) -- 001/002 (digitalocean) couldn't be
# churned this way regardless.

