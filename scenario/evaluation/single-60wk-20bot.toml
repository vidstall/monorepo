provider = "akamai"
size = "g6-standard-4"
worker_index = 1

# --- Actions timeline (run separately via `vidctl scenario run`, only against an
# already-`apply`'d + active scenario) -----------------------------------------
#
# Three overlapping phases:
#   1. Room setup (0-5min): create the room, 19 bots join it, 5-per-bot-host, one
#      media-mode bucket per host.
#   2. Worker churn (5-13min): hosts 006/007/010 each go down as a WHOLE NODE (all
#      10 workers on that host pause together) and come back ~4min later --
#      staggered so the three outages overlap (a harder test than one-at-a-time).
#      >= 30 workers get a leave action, covering every role.
#   3. Bot churn (6-11min): 6 of the 20 bots (one from each media-mode bucket, plus
#      2 extra) leave the room and rejoin later, independent of the worker churn.
#   4. Final teardown once everything has settled back.

[[actions]]
id = "room1"
type = "bot.create_room"
timestamp = "+10s"
host = "003"
media_mode = "both"

[[actions]]
id = "churn1"
type = "bot.join_room"
room_id = "$room1.roomId"
timestamp = "+25s"
host = "003"
media_mode = "both"

