# Performance eval, type 1/6: baseline. 1 room / 3 bots, no chaos.
# Base topology: scenario/example/akamai-azure.toml (Akamai + Azure only).
# Regenerate: python3 -m cli.scenario.gen_eval_scenarios --base scenario/example/akamai-azure.toml \
#   --out scenario/evaluation/baseline.toml --name akamai-azure-baseline \
#   --rooms 1 --bots-per-room 3 --kill-fraction 0.0 --hold-seconds 300 --seed 0
# Run: vidctl scenario apply scenario/evaluation/baseline.toml --yes && vidctl scenario run --yes

name = "akamai-azure-baseline"
env = "devnet"

[contract]
gas_budget = ""
create_registry_if_missing = false
force = false

[registry]
provider = "digitalocean"
tag = ""

[[frontends]]
name = "site-2-bucket"
object = "frontend"
provider = "alibaba"

