# Performance eval, type 3/6: single-room capacity sweep, STEP 1 of N.
# find_max_capacity.py sweeps bots-per-room (3, 6, 9, ...) in ONE room until
# avg end-to-end latency crosses 400ms, then binary-searches to tighten the
# ceiling -- this file is only the starting step (bots_per_room=3), saved
# for a standalone/manual run. For the actual sweep, use find_max_capacity
# directly (it regenerates every step itself against the same base):
#   python3 -m cli.scenario.find_max_capacity --mode single-room \
#     --base scenario/example/akamai-azure.toml --out-dir runtime/eval/single-room-capacity \
#     --start 3 --step 3 --threshold-ms 400 --hold-seconds 300
# Base topology: scenario/example/akamai-azure.toml (Akamai + Azure only).
# Regenerate (this file only): python3 -m cli.scenario.gen_eval_scenarios \
#   --base scenario/example/akamai-azure.toml --out scenario/evaluation/single-room-capacity.toml \
#   --name akamai-azure-single-room-capacity --rooms 1 --bots-per-room 3 \
#   --kill-fraction 0.0 --hold-seconds 300 --seed 0

name = "akamai-azure-single-room-capacity"
env = "devnet"

[contract]
gas_budget = ""
create_registry_if_missing = false
force = false

