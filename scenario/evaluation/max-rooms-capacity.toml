# Performance eval, type 5/6: max-room-count capacity sweep, STEP 1 of N.
# find_max_capacity.py sweeps room COUNT (3, 6, 9, ...) at a fixed 2
# bots/room until avg end-to-end latency crosses 400ms, then binary-searches
# to tighten the ceiling -- this file is only the starting step (rooms=3),
# saved for a standalone/manual run. For the actual sweep:
#   python3 -m cli.scenario.find_max_capacity --mode max-rooms \
#     --base scenario/example/akamai-azure.toml --out-dir runtime/eval/max-rooms-capacity \
#     --start 3 --step 3 --threshold-ms 400 --hold-seconds 300
# Base topology: scenario/example/akamai-azure.toml (Akamai + Azure only).
# Regenerate (this file only): python3 -m cli.scenario.gen_eval_scenarios \
#   --base scenario/example/akamai-azure.toml --out scenario/evaluation/max-rooms-capacity.toml \
#   --name akamai-azure-max-rooms-capacity --rooms 3 --bots-per-room 2 \
#   --kill-fraction 0.0 --hold-seconds 300 --seed 0

name = "akamai-azure-max-rooms-capacity"
env = "devnet"

