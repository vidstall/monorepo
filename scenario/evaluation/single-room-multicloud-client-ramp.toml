# Single-room, multi-cloud client-ramp stress scenario. One room, one bot
# creating it, then a sequence of bot.join_room/bot.delete_room actions
# ramping the concurrent client count through the target steps below --
# there's no ramp/step-array field in the scenario schema, so this is
# expressed as individual timestamped join/delete actions, same pattern as
# scenario/evaluation/single-60wk-20bot.toml's 1->20 bot ramp.
#
# Target concurrent-client steps (held ~2min each before ramping to the
# next): 2 -> 5 -> 10 -> 20 -> 15 -> 25 -> 30 -> 40.
#
# Topology: 11 instances total -- 7 run the "worker" role set (1x
# validator-daemon, 1x relay, 2x cp-daemon), 4 run a
# singleton `bot` control server used to drive the client ramp above.
#   - digitalocean: 3 worker instances (001-003)
#   - akamai: 2 worker instances (004-005) + 3 bot instances (006-008)
#   - azure: 2 worker instances (009-010) + 1 bot instance (011), each in
#     its own region -- Standard_D2als_v7 is a 2-vCPU SKU and this
#     subscription is capped at 3 vCPU/region, so two such VMs can't share
#     a region.
#
# `host` ids are a single continuous zero-padded sequence 001-011 across
# all three providers (required by _group_vm_workers() in
# IaC/pulumi/app/program.py -- see scenario/example/multicloud.toml for the
# same renumbering convention).
name = "single-room-multicloud-client-ramp"
env = "devnet"

[contract]
gas_budget = ""
create_registry_if_missing = false
force = false

# Images already published to DigitalOcean's registry -- Akamai/Azure hosts
# just pull from it like any other host, same convention as every other
# scenario/example/*.toml.
[registry]
provider = "digitalocean"
tag = ""

# Republish the existing frontend site (same name/provider as the currently
# deployed bucket in runtime/topology.toml) so it picks up THIS scenario's
# freshly-published contract IDs -- needed for a real browser to open a
# bot's joinUrl and watch the ramp live. Reusing name+provider updates it in
# place; never deleted by apply/destroy (see scenario/README.md).
[[frontends]]
name = "site-2-bucket"
object = "frontend"
provider = "alibaba"

