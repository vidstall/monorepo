# --- Actions timeline (run separately via `vidctl scenario run`, only
# against an already-`apply`'d + active scenario) ------------------------
#
# `timestamp` is a "+<duration>" offset from when `scenario run` starts (NOT
# chained off the previous action). Bot session ids are `j0`..`j44`: j0 is
# the room creator, j1-j44 are subsequent joins/rejoins. Each id's `host`
# stays fixed to whichever of the 4 bot instances (round-robin: 006, 007,
# 008, 011) created that session, since a bot's control API and session
# list are per-host -- a delete for a given id must target the same host
# that created it.
#
# Ramp schedule (window = 120s each, ramp actions ~10s apart starting 5s
# into the window, then held flat for the rest of the window):
#   t=10s        j0  create_room                        -> count 1
#   t=20s        j1  join                                -> count 2   (step 1: target 2)
#   t=125-145s   j2-j4 join (+3)                          -> count 5   (step 2: target 5)
#   t=245-285s   j5-j9 join (+5)                          -> count 10  (step 3: target 10)
#   t=365-455s   j10-j19 join (+10)                       -> count 20  (step 4: target 20)
#   t=485-525s   delete j15-j19 (-5)                      -> count 15  (step 5: target 15)
#   t=605-695s   j20-j29 join (+10)                       -> count 25  (step 6: target 25)
#   t=725-765s   j30-j34 join (+5)                        -> count 30  (step 7: target 30)
#   t=845-935s   j35-j44 join (+10)                       -> count 40  (step 8: target 40)
#   t=965s+      final teardown: delete all 40 remaining sessions, 3s apart
[[actions]]
id = "j0"
type = "bot.create_room"
timestamp = "+10s"
host = "006"
media_mode = "both"

[[actions]]
id = "j1"
type = "bot.join_room"
room_id = "$j0.roomId"
timestamp = "+20s"
host = "007"
media_mode = "both"

