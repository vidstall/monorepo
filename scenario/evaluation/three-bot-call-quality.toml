# Single-provider, 3-bot call-quality scenario. One room, 3 bots join near
# the start and hold a steady 3-way call for ~10 minutes (no ramp, no
# churn), then all 3 leave near the end. Meant to measure baseline call
# quality (latency/jitter/packet loss/bitrate) rather than stress load --
# see scenario/evaluation/single-room-multicloud-client-ramp.toml for the
# load-ramp counterpart.
#
# Each of the 3 DigitalOcean instances runs the same 7-worker set (3x
# validator-daemon, 3x cp-daemon, 1x relay) PLUS one bot, so
# "3 bots on 3 instances" is 1 bot colocated with each instance's worker
# set rather than needing separate bot-only hosts.
name = "three-bot-call-quality"
env = "devnet"

[contract]
gas_budget = ""
create_registry_if_missing = false
force = false

[registry]
provider = "digitalocean"
tag = ""

# Republish the existing frontend site (same name/provider as the currently
# deployed bucket in runtime/topology.toml) so it picks up THIS scenario's
# freshly-published contract IDs -- needed for a real browser to open a
# bot's joinUrl and watch the call live. Reusing name+provider updates it in
# place; never deleted by apply/destroy (see scenario/README.md).
[[frontends]]
name = "site-2-bucket"
object = "frontend"
provider = "alibaba"

# host 001 -- 3x validator-daemon, 3x cp-daemon, 1x relay, 1x bot

[[workers]]
host = "001"
service = "validator-daemon"
provider = "digitalocean"
size = "s-4vcpu-8gb"
worker_index = 1

