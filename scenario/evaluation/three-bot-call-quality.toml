# --- Actions timeline (run separately via `vidctl scenario run`, only
# against an already-`apply`'d + active scenario) -----------------------
#
# All 3 bots join within the first 30s, hold a steady 3-way call for
# ~9.5 minutes, then all 3 leave within the last 10s -- a flat
# join/hold/leave shape (no ramp, no churn), meant to give the post-run
# report's step-plateau detection one long, clean count=3 window to
# aggregate quality stats over.

[[actions]]
id = "room1"
type = "bot.create_room"
timestamp = "+10s"
host = "001"
media_mode = "both"

[[actions]]
id = "bot2"
type = "bot.join_room"
room_id = "$room1.roomId"
timestamp = "+20s"
host = "002"
media_mode = "both"

[[actions]]
id = "bot3"
type = "bot.join_room"
room_id = "$room1.roomId"
timestamp = "+30s"
host = "003"
media_mode = "both"

[[actions]]
type = "bot.delete_room"
timestamp = "+600s"
host = "003"
bot_id = "$bot3.botId"

[[actions]]
type = "bot.delete_room"
timestamp = "+605s"
host = "002"
bot_id = "$bot2.botId"

[[actions]]
type = "bot.delete_room"
timestamp = "+610s"
host = "001"
bot_id = "$room1.botId"
