name = "akamai-devnet-sample"
env = "devnet"

[contract]
gas_budget = ""
create_registry_if_missing = false
force = false

# Reuse the DigitalOcean-hosted registry -- images are already published there
# (scenario/example/digitalocean.toml); pushing the same images to a second,
# separately-billed registry would be pure waste. Akamai instances just pull
# from it like any other host.
[registry]
provider = "digitalocean"
tag = ""

[[workers]]
host = "001"
service = "signaling"
provider = "akamai"
size = "g6-standard-4"
worker_index = 1

[[workers]]
host = "001"
service = "relay"
provider = "akamai"
size = "g6-standard-4"
worker_index = 1

[[workers]]
host = "001"
service = "cp-daemon"
provider = "akamai"
size = "g6-standard-4"
worker_index = 1

[[workers]]
