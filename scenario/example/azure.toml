name = "azure-devnet-sample"
env = "devnet"

[contract]
gas_budget = ""
create_registry_if_missing = false
force = false

# Reuse the DigitalOcean-hosted registry -- images are already published there
# (scenario/example/digitalocean.toml); pushing the same images to a second,
# separately-billed registry would be pure waste. Azure instances just pull
# from it like any other host.
[registry]
provider = "digitalocean"
tag = ""

[[workers]]
host = "001"
service = "signaling"
provider = "azure"
size = "Standard_D2als_v7"
worker_index = 1

[[workers]]
host = "001"
service = "relay"
provider = "azure"
size = "Standard_D2als_v7"
worker_index = 1

