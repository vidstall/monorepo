# Straight merge of digitalocean.toml + akamai.toml + azure.toml -- one
# scenario spanning three providers at once. DigitalOcean's hosts are
# renamed node-1/2/3 -> do-node-1/2/3 here for consistency with the other
# two providers' <provider>-node-N convention; the topology/inventory
# resolve host identity dynamically at deploy time, so nothing else needed
# to change for the rename. Every other field (service/size/worker_index/
# region) is carried over unchanged from its source file.
name = "multicloud-devnet-sample"
env = "devnet"

[contract]
gas_budget = ""
create_registry_if_missing = false
force = false

[registry]
provider = "digitalocean"
tag = ""

[[frontends]]
name = "site-2-bucket"
object = "frontend"
provider = "alibaba"

# --- DigitalOcean (from digitalocean.toml, node-1/2/3 -> do-node-1/2/3) ---

[[workers]]
host = "do-node-1"
service = "signaling"
provider = "digitalocean"
size = "s-4vcpu-8gb"
worker_index = 1

