# Straight merge of digitalocean.toml + akamai.toml + azure.toml -- one
# scenario spanning three providers at once. `host` is a zero-padded,
# >=3-digit instance id counting from 1, unique across the WHOLE scenario
# file regardless of provider (see _validate_host_id() in
# cli/scenario/spec.py and _group_vm_workers() in
# IaC/pulumi/app/program.py, which groups VM rows to colocate by this raw
# string -- two providers sharing the same id would be wrongly merged into
# one VM group). So each source file's hosts are renumbered here into one
# continuous sequence: digitalocean 001-003, akamai 004-007, azure 008-011.
# Every other field (service/size/worker_index/region) is carried over
# unchanged from its source file.
name = "multicloud-devnet-sample"
env = "devnet"

[contract]
gas_budget = ""
create_registry_if_missing = false
force = false

[registry]
provider = "digitalocean"
tag = ""

[[frontends]]
name = "site-2-bucket"
object = "frontend"
provider = "alibaba"

