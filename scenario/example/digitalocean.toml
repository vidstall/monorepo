# Bot control server -- singleton (never colocate a second instance; its
# HTTP control API is reached directly at a single host). Test/demo tool
# only, not part of network role economics -- see apps/bot/README.md.
[[workers]]
host = "001"
service = "bot"
provider = "digitalocean"
size = "s-4vcpu-8gb"
worker_index = 1

# Monitoring is NOT a scenario worker anymore -- prometheus now runs on a
# dedicated, operator-owned static host managed entirely by `vidctl
# observer` (see `vidctl observer add-host`/`deploy`), not a disposable
# Pulumi-provisioned VM colocated with the rest of this scenario.
# `vidctl infra start --service prometheus` is rejected for exactly this
# reason (see cli/infra/control.py).

