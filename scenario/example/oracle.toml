name = "oracle-devnet-sample"
env = "devnet"

[contract]
gas_budget = ""
create_registry_if_missing = false
force = false

# Reuse the DigitalOcean-hosted registry -- images are already published there
# (scenario/example/digitalocean.toml); pushing the same images to a second,
# separately-billed registry would be pure waste. Oracle Cloud instances just
# pull from it like any other host.
[registry]
provider = "digitalocean"
tag = ""

# All workers deliberately omit `region` and rely on OCI_REGION's default
# (secrets/cloud/oci.env) -- verified live (list_region_subscriptions) that
# this tenancy has exactly one subscribed region, ap-singapore-1 (its home
# region).
#
# Single host, all 13 workers colocated -- not the 4-host split
# azure.toml/upcloud.toml use. Confirmed live: this tenancy's ap-singapore-1
# has exactly one availability domain (list_availability_domains), and it
# returned a hard "500-InternalError, Out of host capacity" for BOTH the
# free-tier "VM.Standard.E2.1.Micro" shape AND the paid x86
# "VM.Standard.E4.Flex" shape, with no alternate AD to retry against --
# an AD-wide x86 capacity shortage, not a shape-tier problem. Switched to
# "VM.Standard.A1.Flex" (Ampere/ARM, confirmed available via list_shapes),
# which draws from a separate capacity pool than the x86 E-series. compute/
# oci.py defaults a ".Flex" shape's shape_config to
# 2 OCPU / 4GB (matching the "2cpu-4gb" sizing the other example scenarios
# use) since per-worker OCPU/memory isn't plumbed through scenario TOML.

[[workers]]
host = "001"
service = "relay"
provider = "oci"
size = "VM.Standard.A1.Flex"
worker_index = 1

[[workers]]
host = "001"
service = "relay"
provider = "oci"
size = "VM.Standard.A1.Flex"
worker_index = 2

[[workers]]
host = "001"
service = "cp-daemon"
provider = "oci"
size = "VM.Standard.A1.Flex"
worker_index = 1

[[workers]]
