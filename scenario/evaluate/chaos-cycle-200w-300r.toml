# Fault tolerance: a bot creates a room, an Akamai relay/cp-daemon worker
# leaves (paused) at +30s, rejoins via pool-reuse at +2m, room is torn down
# at +5m. Extra validator-daemon headroom is added so live validators stay
# above 2/3-of-registered quorum even after the leave.
# worker.leave/worker.join currently only work for --provider alibaba/akamai,
# hence the Akamai target.

name = "chaos-cycle-200w-300r"
env = "devnet"

[registry]
provider = "digitalocean"
tag = "chaos-cycle-200w-300r"

[[workers]]
host = "001"
service = "signaling"
provider = "digitalocean"
worker_index = 1
size = "s-4vcpu-8gb"
region = "nyc3"

