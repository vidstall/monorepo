# Worker/validator scale-out: a brand-new validator-daemon worker joins
# the already-running network at +30s. Unlike the chaos-cycle scenario's
# worker.join (host omitted -> reclaims a paused pool worker), this one's
# `host` is explicitly a fresh id never declared in [[workers]], forcing
# genuine new provisioning -- there is nothing paused to reuse here.

name = "worker-join-scaleout-100w-050r"
env = "devnet"

[registry]
provider = "digitalocean"
tag = "worker-join-scaleout-100w-050r"

[[workers]]
host = "001"
service = "signaling"
provider = "digitalocean"
worker_index = 1
size = "s-4vcpu-8gb"
region = "nyc3"

