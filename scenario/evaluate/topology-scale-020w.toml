# Topology/infra scale axis: 20 total signaling/relay/cp-daemon/
# validator-daemon workers, minimal load (1 bot host, nominally 1 room).
# Isolates registry/quorum-bootstrap/deploy scaling from media load.

name = "topology-scale-020w"
env = "devnet"

[registry]
provider = "digitalocean"
tag = "topology-scale-020w"

