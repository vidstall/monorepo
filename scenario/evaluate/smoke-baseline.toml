# Smoke/e2e baseline -- fastest, cheapest scenario to re-run after any
# code change, before spending time/money on the larger tiers below.

name = "smoke-baseline"
env = "devnet"

[registry]
provider = "digitalocean"
tag = "smoke-baseline"

[[workers]]
host = "001"
service = "signaling"
provider = "digitalocean"
worker_index = 1
size = "s-4vcpu-8gb"
region = "nyc3"

