# Room/bot-host scale axis: 300 target concurrent rooms ->
# bot_hosts = ceil(300/5) = 60 dedicated bot hosts (empirically
# ~5 concurrent rooms/bot-host, not a coded limit). Topology fixed at 200
# workers so infra isn't the bottleneck being measured.
#
# NOTE: intentionally deviates from the single-bot-host convention used in
# scenario/example/*.toml -- this axis specifically measures bot-host/room
# scaling, so multiple dedicated bot hosts are provisioned on purpose.

name = "room-scale-300r-60bh"
env = "devnet"

[registry]
provider = "digitalocean"
tag = "room-scale-300r-60bh"

[[workers]]
host = "001"
service = "signaling"
provider = "digitalocean"
worker_index = 1
size = "s-4vcpu-8gb"
region = "nyc3"

